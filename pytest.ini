[pytest]
testpaths = 
    tests
    skills/skill-cli/tests
    skills/finance-pro/tests
    skills/coding-pro/tests
    skills/product-pro/tests
    skills/research-pro/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
