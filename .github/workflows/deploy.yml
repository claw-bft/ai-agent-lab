name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          # Copy ClawHub Web (优先)
          cp -r clawhub-web/* _site/ 2>/dev/null || true
          # Copy docs content
          cp -r docs/* _site/docs/ 2>/dev/null || true
          # Copy visual reports
          cp -r visual-reports/* _site/visual-reports/ 2>/dev/null || true
          # Copy skill-cli HTML coverage if exists
          cp -r skills/skill-cli/htmlcov _site/coverage/skill-cli 2>/dev/null || true
          # Copy stock-portfolio-analyzer HTML coverage if exists  
          cp -r skills/stock-portfolio-analyzer/htmlcov _site/coverage/stock-portfolio-analyzer 2>/dev/null || true
          # Create fallback index.html if clawhub-web not exists
          if [ ! -f _site/index.html ]; then
            cat > _site/index.html << 'EOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 3rem; margin-bottom: 10px; text-align: center; }
        .subtitle { text-align: center; opacity: 0.9; margin-bottom: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h2 { font-size: 1.5rem; margin-bottom: 12px; }
        .card p { opacity: 0.8; line-height: 1.6; }
        .card a {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .card a:hover { background: rgba(255,255,255,0.3); }
        .footer {
            text-align: center;
            margin-top: 60px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Agent Lab</h1>
        <p class="subtitle">AI Agent 技能包平台与生态系统</p>
        
        <div class="grid">
            <div class="card">
                <h2>📊 可视化报告</h2>
                <p>股票分析、市场监控、系统状态等可视化报告集合</p>
                <a href="./visual-reports/">查看报告</a>
            </div>
            <div class="card">
                <h2>📚 项目文档</h2>
                <p>CONTRIBUTING指南、迭代报告、技术文档</p>
                <a href="./CONTRIBUTING.md">查看文档</a>
            </div>
            <div class="card">
                <h2>🧪 测试覆盖率</h2>
                <p>各技能包的测试覆盖率报告</p>
                <a href="./coverage/">查看覆盖率</a>
            </div>
            <div class="card">
                <h2>🔧 技能包</h2>
                <p>24个AI Agent技能包，涵盖金融、开发、研究等领域</p>
                <a href="https://github.com/claw-bft/ai-agent-lab">GitHub仓库</a>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 AI Agent Lab | Built with ❤️ by claw-bft</p>
        </div>
    </div>
</body>
</html>
EOF
          fi
          # List what we're deploying
          echo "=== Deployment contents ==="
          find _site -type f | head -30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  # Deploy job
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
