name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run tests daily at 2 AM UTC (10 AM Beijing Time)
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8 black isort
          # Install skill-specific dependencies
          if [ -f skills/coding-pro/requirements.txt ]; then
            pip install -r skills/coding-pro/requirements.txt
          fi
          if [ -f skills/finance-pro/requirements.txt ]; then
            pip install -r skills/finance-pro/requirements.txt
          fi

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.git
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude=venv,__pycache__,.git

      - name: Check code formatting with black
        run: |
          black --check --diff . --exclude='venv|__pycache__' || true

      - name: Run tests with pytest
        run: |
          pytest --cov=skills --cov-report=xml --cov-report=term -v || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-skills:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Test coding-pro skill
        run: |
          cd skills/coding-pro
          python -m pytest tests/ -v || echo "No tests found for coding-pro"

      - name: Test finance-pro skill
        run: |
          cd skills/finance-pro
          python -m pytest tests/ -v || echo "No tests found for finance-pro"

      - name: Test product-pro skill
        run: |
          cd skills/product-pro
          python -m pytest tests/ -v || echo "No tests found for product-pro"

      - name: Test skill-cli
        run: |
          cd skills/skill-cli
          python -m pytest tests/ -v || echo "No tests found for skill-cli"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json --exclude ./venv,./__pycache__,./.git || true
          bandit -r . --exclude ./venv,./__pycache__,./.git || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: bandit-report.json
        if: always()

  build-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation tools
        run: |
          pip install mkdocs mkdocs-material

      - name: Build documentation
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "No mkdocs.yml found, skipping documentation build"
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [test, test-skills, security-scan]
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.test.result == 'success' && needs.test-skills.result == 'success'
        run: |
          echo "✅ All tests passed successfully!"
          
      - name: Notify on failure
        if: needs.test.result == 'failure' || needs.test-skills.result == 'failure'
        run: |
          echo "❌ Some tests failed. Check the logs above for details."
          exit 1
