<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络延迟监控报告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-detail {
            color: #666;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .chart-container h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }
        .timestamp {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 20px;
            font-size: 0.9em;
        }
        .status-good { color: #28a745; }
        .status-warn { color: #ffc107; }
        .status-bad { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 网络延迟监控报告</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h2>🐙 GitHub</h2>
                <div class="stat-value">136.0<small style="font-size:0.5em">ms</small></div>
                <div class="stat-detail">
                    最小: 136.0ms | 最大: 136.0ms<br>
                    样本数: 1
                </div>
            </div>
            <div class="stat-card">
                <h2>🔍 Google</h2>
                <div class="stat-value">N/A<small style="font-size:0.5em">ms</small></div>
                <div class="stat-detail">
                    最小: N/Ams | 最大: N/Ams<br>
                    样本数: 0
                </div>
            </div>
            <div class="stat-card">
                <h2>🇨🇳 百度</h2>
                <div class="stat-value">10.7<small style="font-size:0.5em">ms</small></div>
                <div class="stat-detail">
                    最小: 10.7ms | 最大: 10.7ms<br>
                    样本数: 1
                </div>
            </div>
        </div>
        
        <div class="chart-container">
            <h3>📊 延迟趋势图 (最近50次测试)</h3>
            <canvas id="latencyChart"></canvas>
        </div>
        
        <div class="timestamp">
            报告生成时间: 2026-02-26 19:13:55<br>
            数据来源: 实时Ping测试
        </div>
    </div>
    
    <script>
        const ctx = document.getElementById('latencyChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['2026-02-26 19:13:43'],
                datasets: [
                    {
                        label: 'GitHub',
                        data: [136.0],
                        borderColor: '#6f42c1',
                        backgroundColor: 'rgba(111, 66, 193, 0.1)',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Google',
                        data: ['null'],
                        borderColor: '#4285f4',
                        backgroundColor: 'rgba(66, 133, 244, 0.1)',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Baidu',
                        data: [10.7],
                        borderColor: '#de0a19',
                        backgroundColor: 'rgba(222, 10, 25, 0.1)',
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: '平均延迟 (ms)'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '延迟 (ms)'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
