<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻智能分析中心 - 实时热点监测</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(147, 51, 234, 0.1) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .news-item { transition: all 0.3s ease; }
        .news-item:hover { transform: translateX(4px); background: rgba(59, 130, 246, 0.15); }
        .tag {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .heat-high { color: #ef4444; }
        .heat-medium { color: #f59e0b; }
        .heat-low { color: #10b981; }
        .sentiment-positive { color: #10b981; }
        .sentiment-negative { color: #ef4444; }
        .sentiment-neutral { color: #94a3b8; }
        @media (max-width: 768px) {
            .chart-container { height: 280px !important; }
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-white">
    <!-- Header -->
    <header class="glass sticky top-0 z-50 px-4 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 rounded-xl flex items-center justify-center shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">新闻智能分析中心</h1>
                    <p class="text-xs text-gray-400">实时热点 · 关联分析 · 影响评估</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-sm font-medium" id="lastUpdate">加载中...</p>
                <p class="text-xs text-gray-400">每30分钟自动刷新</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card rounded-2xl p-4 text-center">
                <p class="text-gray-400 text-xs mb-1">热点新闻</p>
                <p class="text-3xl font-bold text-blue-400" id="totalNews">-</p>
                <p class="text-xs text-gray-500 mt-1">条实时数据</p>
            </div>
            <div class="glass-card rounded-2xl p-4 text-center">
                <p class="text-gray-400 text-xs mb-1">关联关系</p>
                <p class="text-3xl font-bold text-purple-400" id="relationsCount">-</p>
                <p class="text-xs text-gray-500 mt-1">语义相似度>0.5</p>
            </div>
            <div class="glass-card rounded-2xl p-4 text-center">
                <p class="text-gray-400 text-xs mb-1">高影响事件</p>
                <p class="text-3xl font-bold text-red-400" id="highImpact">-</p>
                <p class="text-xs text-gray-500 mt-1">综合评分>8</p>
            </div>
            <div class="glass-card rounded-2xl p-4 text-center">
                <p class="text-gray-400 text-xs mb-1">平均热度</p>
                <p class="text-3xl font-bold text-green-400" id="avgHeat">-</p>
                <p class="text-xs text-gray-500 mt-1">满分100</p>
            </div>
        </div>

        <!-- Charts Row 1 -->
        <div class="grid md:grid-cols-2 gap-6">
            <div class="glass rounded-2xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center">
                        <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                        新闻关联网络
                    </h2>
                    <span class="text-xs text-gray-400">拖拽节点可调整布局</span>
                </div>
                <div id="networkChart" class="w-full chart-container" style="height: 320px;">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <div class="glass rounded-2xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center">
                        <span class="w-2 h-2 bg-purple-500 rounded-full mr-2"></span>
                        影响维度雷达图
                    </h2>
                    <span class="text-xs text-gray-400">社会/经济/政治/科技</span>
                </div>
                <div id="impactChart" class="w-full chart-container" style="height: 320px;">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>

        <!-- Charts Row 2 -->
        <div class="grid md:grid-cols-2 gap-6">
            <div class="glass rounded-2xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                        新闻分类分布
                    </h2>
                </div>
                <div id="categoryChart" class="w-full chart-container" style="height: 280px;">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <div class="glass rounded-2xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center">
                        <span class="w-2 h-2 bg-orange-500 rounded-full mr-2"></span>
                        热度排行TOP5
                    </h2>
                </div>
                <div id="heatChart" class="w-full chart-container" style="height: 280px;">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>

        <!-- Sentiment Analysis -->
        <div class="grid md:grid-cols-3 gap-6">
            <div class="glass rounded-2xl p-4">
                <h2 class="text-lg font-semibold mb-4 flex items-center">
                    <span class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>
                    情感分布
                </h2>
                <div id="sentimentChart" class="w-full" style="height: 200px;"></div>
            </div>
            <div class="glass rounded-2xl p-4 md:col-span-2">
                <h2 class="text-lg font-semibold mb-4 flex items-center">
                    <span class="w-2 h-2 bg-cyan-500 rounded-full mr-2"></span>
                    关键词云
                </h2>
                <div id="keywordChart" class="w-full" style="height: 200px;"></div>
            </div>
        </div>

        <!-- News Timeline -->
        <div class="glass rounded-2xl p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold flex items-center">
                    <span class="w-2 h-2 bg-pink-500 rounded-full mr-2"></span>
                    热点新闻时间线
                </h2>
                <div class="flex space-x-2">
                    <span class="px-2 py-1 text-xs rounded bg-blue-500/20 text-blue-300">科技</span>
                    <span class="px-2 py-1 text-xs rounded bg-green-500/20 text-green-300">财经</span>
                    <span class="px-2 py-1 text-xs rounded bg-purple-500/20 text-purple-300">政策</span>
                    <span class="px-2 py-1 text-xs rounded bg-red-500/20 text-red-300">国际</span>
                </div>
            </div>
            <div id="newsList" class="space-y-3 max-h-[500px] overflow-y-auto">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </main>

    <footer class="max-w-7xl mx-auto px-4 py-6 text-center text-gray-500 text-sm">
        <p>新闻智能分析中心 © 2026 | 数据来源: 综合各大新闻平台 | 每30分钟自动更新</p>
    </footer>

    <script>
        // Color mapping for categories
        const categoryColors = {
            '科技': '#3b82f6',
            '财经': '#10b981',
            '政策': '#8b5cf6',
            '社会': '#f59e0b',
            '政治': '#ef4444',
            '国际政治': '#dc2626',
            '国际': '#dc2626',
            '其他': '#6b7280'
        };

        const sentimentColors = {
            'positive': '#10b981',
            'negative': '#ef4444',
            'neutral': '#94a3b8'
        };

        // Initialize charts
        let networkChart, impactChart, categoryChart, heatChart, sentimentChart, keywordChart;

        async function loadData() {
            try {
                const response = await fetch('./data.json?t=' + Date.now());
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Failed to load data:', error);
                // Fallback to embedded data
                return null;
            }
        }

        function initCharts(data) {
            networkChart = echarts.init(document.getElementById('networkChart'));
            impactChart = echarts.init(document.getElementById('impactChart'));
            categoryChart = echarts.init(document.getElementById('categoryChart'));
            heatChart = echarts.init(document.getElementById('heatChart'));
            sentimentChart = echarts.init(document.getElementById('sentimentChart'));
            keywordChart = echarts.init(document.getElementById('keywordChart'));

            updateStats(data);
            renderNetworkChart(data);
            renderImpactChart(data);
            renderCategoryChart(data);
            renderHeatChart(data);
            renderSentimentChart(data);
            renderKeywordChart(data);
            renderNewsList(data);

            // Update timestamp
            const date = new Date(data.timestamp);
            document.getElementById('lastUpdate').textContent = 
                `更新于: ${date.toLocaleString('zh-CN', { 
                    month: '2-digit', day: '2-digit', 
                    hour: '2-digit', minute: '2-digit' 
                })}`;
        }

        function updateStats(data) {
            document.getElementById('totalNews').textContent = data.stats.total;
            document.getElementById('relationsCount').textContent = data.relations.length;
            document.getElementById('highImpact').textContent = data.stats.highImpact;
            document.getElementById('avgHeat').textContent = data.stats.avgHeat.toFixed(1);
        }

        function renderNetworkChart(data) {
            const nodes = data.news.map(item => ({
                id: item.id,
                name: item.title.substring(0, 6) + (item.title.length > 6 ? '...' : ''),
                fullTitle: item.title,
                symbolSize: 15 + item.heat / 8,
                category: item.category,
                heat: item.heat,
                impact: ((item.impact.social + item.impact.economic + item.impact.political + item.impact.tech) / 4).toFixed(1),
                itemStyle: { color: categoryColors[item.category] || '#999' }
            }));

            const links = data.relations.map(r => ({
                source: r.source,
                target: r.target,
                value: r.strength,
                relationType: r.type,
                lineStyle: { 
                    width: r.strength * 4,
                    curveness: 0.2,
                    opacity: 0.5
                }
            }));

            const categories = [...new Set(data.news.map(n => n.category))].map(name => ({ 
                name,
                itemStyle: { color: categoryColors[name] || '#999' }
            }));

            networkChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(30, 41, 59, 0.95)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#fff' },
                    formatter: function(params) {
                        if (params.dataType === 'node') {
                            return `<div style="max-width:220px">
                                <strong style="color:#60a5fa">${params.data.fullTitle}</strong><br/>
                                <span style="color:#94a3b8">分类:</span> ${params.data.category}<br/>
                                <span style="color:#94a3b8">热度:</span> <span style="color:#fbbf24">${params.data.heat}</span><br/>
                                <span style="color:#94a3b8">影响分:</span> ${params.data.impact}
                            </div>`;
                        }
                        return `<span style="color:#94a3b8">关联类型:</span> ${params.data.relationType}<br/>
                                <span style="color:#94a3b8">关联度:</span> <span style="color:#60a5fa">${(params.data.value * 100).toFixed(0)}%</span>`;
                    }
                },
                legend: {
                    data: categories.map(c => c.name),
                    textStyle: { color: '#94a3b8', fontSize: 10 },
                    bottom: 0,
                    itemWidth: 12,
                    itemHeight: 12
                },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    data: nodes,
                    links: links,
                    categories: categories,
                    roam: true,
                    draggable: true,
                    label: {
                        show: true,
                        position: 'bottom',
                        fontSize: 9,
                        color: '#cbd5e1'
                    },
                    force: {
                        repulsion: 200,
                        gravity: 0.1,
                        edgeLength: [60, 120]
                    },
                    emphasis: {
                        focus: 'adjacency',
                        lineStyle: { width: 6, opacity: 1 }
                    }
                }]
            });
        }

        function renderImpactChart(data) {
            // Calculate weighted average impact
            const totalHeat = data.news.reduce((sum, n) => sum + n.heat, 0);
            const avgImpact = { social: 0, economic: 0, political: 0, tech: 0 };
            
            data.news.forEach(item => {
                const weight = item.heat / totalHeat;
                avgImpact.social += item.impact.social * weight;
                avgImpact.economic += item.impact.economic * weight;
                avgImpact.political += item.impact.political * weight;
                avgImpact.tech += item.impact.tech * weight;
            });

            impactChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(30, 41, 59, 0.95)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#fff' }
                },
                radar: {
                    indicator: [
                        { name: '社会影响', max: 10 },
                        { name: '经济影响', max: 10 },
                        { name: '政治影响', max: 10 },
                        { name: '科技影响', max: 10 }
                    ],
                    axisName: { color: '#94a3b8', fontSize: 11 },
                    splitArea: {
                        areaStyle: {
                            color: ['rgba(59, 130, 246, 0.05)', 'rgba(59, 130, 246, 0.1)']
                        }
                    },
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: [
                            avgImpact.social.toFixed(1),
                            avgImpact.economic.toFixed(1),
                            avgImpact.political.toFixed(1),
                            avgImpact.tech.toFixed(1)
                        ],
                        name: '加权平均影响',
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(59, 130, 246, 0.6)' },
                                { offset: 1, color: 'rgba(147, 51, 234, 0.4)' }
                            ])
                        },
                        lineStyle: { color: '#3b82f6', width: 2 },
                        itemStyle: { color: '#3b82f6' }
                    }]
                }]
            });
        }

        function renderCategoryChart(data) {
            const categoryCount = data.stats.categories;
            
            categoryChart.setOption({
                backgroundColor: 'transparent',
                tooltip: { 
                    trigger: 'item',
                    backgroundColor: 'rgba(30, 41, 59, 0.95)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#fff' }
                },
                legend: {
                    orient: 'vertical',
                    right: 10,
                    top: 'center',
                    textStyle: { color: '#94a3b8', fontSize: 11 }
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['35%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 8,
                        borderColor: '#1e293b',
                        borderWidth: 2
                    },
                    label: { 
                        show: true,
                        formatter: '{b}\n{c}条',
                        color: '#cbd5e1',
                        fontSize: 10
                    },
                    emphasis: {
                        label: { fontSize: 12, fontWeight: 'bold' }
                    },
                    data: Object.entries(categoryCount).map(([name, value]) => ({
                        name,
                        value,
                        itemStyle: { color: categoryColors[name] || '#6b7280' }
                    }))
                }]
            });
        }

        function renderHeatChart(data) {
            const top5News = [...data.news].sort((a, b) => b.heat - a.heat).slice(0, 5);
            
            heatChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    backgroundColor: 'rgba(30, 41, 59, 0.95)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#fff' },
                    formatter: function(params) {
                        const item = top5News[params[0].dataIndex];
                        return `<strong style="color:#60a5fa">${item.title}</strong><br/>
                                <span style="color:#94a3b8">热度:</span> <span style="color:#fbbf24">${item.heat}</span><br/>
                                <span style="color:#94a3b8">来源:</span> ${item.source}`;
                    }
                },
                grid: { left: '3%', right: '12%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'value',
                    max: 100,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                    axisLabel: { color: '#94a3b8' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                yAxis: {
                    type: 'category',
                    data: top5News.map(item => item.title.substring(0, 8) + (item.title.length > 8 ? '...' : '')),
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                    axisLabel: { color: '#cbd5e1', fontSize: 10 }
                },
                series: [{
                    type: 'bar',
                    data: top5News.map(item => ({
                        value: item.heat,
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                { offset: 0, color: categoryColors[item.category] || '#6b7280' },
                                { offset: 1, color: (categoryColors[item.category] || '#6b7280') + '99' }
                            ]),
                            borderRadius: [0, 4, 4, 0]
                        }
                    })),
                    barWidth: '55%',
                    label: {
                        show: true,
                        position: 'right',
                        formatter: '{c}',
                        color: '#fff',
                        fontSize: 11
                    }
                }]
            });
        }

        function renderSentimentChart(data) {
            const sentiment = data.stats.sentiment;
            
            sentimentChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(30, 41, 59, 0.95)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#fff' }
                },
                series: [{
                    type: 'pie',
                    radius: ['50%', '80%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 6,
                        borderColor: '#1e293b',
                        borderWidth: 2
                    },
                    label: {
                        show: true,
                        formatter: '{b}\n{c}条 ({d}%)',
                        color: '#cbd5e1',
                        fontSize: 10
                    },
                    data: [
                        { name: '正面', value: sentiment.positive, itemStyle: { color: '#10b981' } },
                        { name: '负面', value: sentiment.negative, itemStyle: { color: '#ef4444' } },
                        { name: '中性', value: sentiment.neutral, itemStyle: { color: '#94a3b8' } }
                    ]
                }]
            });
        }

        function renderKeywordChart(data) {
            // Count keyword frequencies
            const keywordCount = {};
            data.news.forEach(item => {
                item.keywords.forEach(kw => {
                    keywordCount[kw] = (keywordCount[kw] || 0) + 1;
                });
            });
            
            const keywordData = Object.entries(keywordCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 20)
                .map(([name, value]) => ({ name, value }));

            keywordChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    show: true,
                    backgroundColor: 'rgba(30, 41, 59, 0.95)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#fff' }
                },
                series: [{
                    type: 'wordCloud',
                    shape: 'circle',
                    left: 'center',
                    top: 'center',
                    width: '90%',
                    height: '90%',
                    right: null,
                    bottom: null,
                    sizeRange: [12, 32],
                    rotationRange: [-45, 45],
                    rotationStep: 45,
                    gridSize: 8,
                    drawOutOfBound: false,
                    textStyle: {
                        fontFamily: 'sans-serif',
                        fontWeight: 'bold',
                        color: function () {
                            const colors = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#06b6d4'];
                            return colors[Math.floor(Math.random() * colors.length)];
                        }
                    },
                    emphasis: {
                        focus: 'self',
                        textStyle: {
                            textShadowBlur: 10,
                            textShadowColor: '#333'
                        }
                    },
                    data: keywordData
                }]
            });
        }

        function renderNewsList(data) {
            const newsListEl = document.getElementById('newsList');
            newsListEl.innerHTML = '';
            
            data.news.sort((a, b) => b.heat - a.heat).forEach(item => {
                const heatClass = item.heat >= 80 ? 'heat-high' : item.heat >= 60 ? 'heat-medium' : 'heat-low';
                const sentimentClass = `sentiment-${item.sentiment}`;
                const impactScore = ((item.impact.social + item.impact.economic + item.impact.political + item.impact.tech) / 4).toFixed(1);
                const sentimentIcon = item.sentiment === 'positive' ? '🟢' : item.sentiment === 'negative' ? '🔴' : '⚪';
                
                const newsEl = document.createElement('div');
                newsEl.className = 'news-item glass-card rounded-xl p-3 cursor-pointer';
                newsEl.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2 mb-1 flex-wrap gap-y-1">
                                <span class="px-2 py-0.5 text-xs rounded font-medium" style="background: ${categoryColors[item.category]}30; color: ${categoryColors[item.category]}">
                                    ${item.category}
                                </span>
                                <span class="text-xs text-gray-400">${item.source}</span>
                                <span class="text-xs ${heatClass} font-medium">🔥 ${item.heat}</span>
                                <span class="text-xs ${sentimentClass}">${sentimentIcon} ${item.sentiment === 'positive' ? '正面' : item.sentiment === 'negative' ? '负面' : '中性'}</span>
                            </div>
                            <h3 class="text-sm font-medium text-gray-100 line-clamp-1" title="${item.title}">${item.title}</h3>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-2">${item.summary}</p>
                            <div class="flex items-center space-x-2 mt-2 flex-wrap gap-y-1">
                                ${item.keywords.slice(0, 4).map(kw => `<span class="tag px-1.5 py-0.5 text-xs rounded text-blue-300">${kw}</span>`).join('')}
                                <span class="text-xs text-gray-500 ml-auto">影响分: ${impactScore}</span>
                            </div>
                        </div>
                    </div>
                `;
                newsListEl.appendChild(newsEl);
            });
        }

        // Load and initialize
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await loadData();
            if (data) {
                initCharts(data);
            }

            // Responsive resize
            window.addEventListener('resize', () => {
                networkChart && networkChart.resize();
                impactChart && impactChart.resize();
                categoryChart && categoryChart.resize();
                heatChart && heatChart.resize();
                sentimentChart && sentimentChart.resize();
                keywordChart && keywordChart.resize();
            });
        });
    </script>
    <!-- WordCloud extension for ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
</body>
</html>
