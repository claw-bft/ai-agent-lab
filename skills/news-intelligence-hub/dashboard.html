        // Network Graph with D3
        function renderNetworkGraph() {
            const container = document.getElementById('networkGraph');
            const width = container.clientWidth;
            const height = container.clientHeight;

            const svg = d3.select('#networkGraph')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Prepare nodes and links
            const nodes = data.news.map(n => ({
                id: n.id,
                title: n.title.substring(0, 20) + '...',
                fullTitle: n.title,
                category: n.category,
                heat: n.heat,
                impact: (n.impact.social + n.impact.economic + n.impact.political + n.impact.tech) / 4
            }));

            const links = data.relations.map(r => ({
                source: r.source,
                target: r.target,
                type: r.type,
                strength: r.strength
            }));

            // Simulation
            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));

            // Draw links
            const link = svg.append('g')
                .selectAll('line')
                .data(links)
                .enter().append('line')
                .attr('class', 'network-link')
                .attr('stroke', '#94a3b8')
                .attr('stroke-width', d => d.strength * 3);

            // Draw nodes
            const node = svg.append('g')
                .selectAll('g')
                .data(nodes)
                .enter().append('g')
                .attr('class', 'network-node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            node.append('circle')
                .attr('r', d => 10 + d.heat / 10)
                .attr('fill', d => categoryColors[d.category])
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);

            node.append('text')
                .attr('dx', 15)
                .attr('dy', 4)
                .text(d => d.title)
                .attr('font-size', '10px')
                .attr('fill', '#64748b');

            // Click event
            node.on('click', (event, d) => {
                const news = data.news.find(n => n.id === d.id);
                showModal(news);
            });

            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }

        // Keyword Cloud
        function renderKeywordCloud() {
            const container = document.getElementById('keywordCloud');
            const keywordCount = {};
            
            data.news.forEach(news => {
                news.keywords.forEach(kw => {
                    keywordCount[kw] = (keywordCount[kw] || 0) + 1;
                });
            });

            const sortedKeywords = Object.entries(keywordCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 20);

            const maxCount = sortedKeywords[0][1];

            sortedKeywords.forEach(([kw, count]) => {
                const size = 0.75 + (count / maxCount) * 1.5;
                const opacity = 0.6 + (count / maxCount) * 0.4;
                const tag = document.createElement('span');
                tag.className = 'tag px-3 py-1 rounded-full text-sm cursor-pointer';
                tag.style.cssText = `
                    font-size: ${size}rem;
                    opacity: ${opacity};
                    background: linear-gradient(135deg, #6366f1, #a855f7);
                    color: white;
                `;
                tag.textContent = kw;
                container.appendChild(tag);
            });
        }
