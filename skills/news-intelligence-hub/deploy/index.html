<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Intelligence Hub - 热点新闻情报中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(20px, 20px); }
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }
        
        .timestamp {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 968px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        
        .card-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 2px;
        }
        
        #network-graph {
            width: 100%;
            height: 400px;
        }
        
        .radar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }
        
        #radar-chart {
            max-width: 100%;
            max-height: 100%;
        }
        
        .news-list {
            margin-top: 30px;
        }
        
        .news-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .news-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }
        
        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .news-title {
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
        }
        
        .news-heat {
            background: linear-gradient(135deg, var(--secondary), #f97316);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .news-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .news-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .news-source {
            color: var(--accent);
            font-size: 0.85rem;
        }
        
        .news-category {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .news-time {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .impact-bars {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .impact-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        
        .impact-bar::before {
            content: attr(data-label);
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        
        .impact-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .impact-social { background: linear-gradient(90deg, #ec4899, #f472b6); }
        .impact-economic { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .impact-political { background: linear-gradient(90deg, #ef4444, #f87171); }
        .impact-tech { background: linear-gradient(90deg, #06b6d4, #22d3ee); }
        
        .timeline {
            margin-top: 30px;
        }
        
        .timeline-item {
            display: flex;
            gap: 20px;
            padding: 15px 0;
            border-left: 2px solid var(--border);
            margin-left: 10px;
            padding-left: 20px;
            position: relative;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 20px;
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }
        
        .timeline-time {
            color: var(--accent);
            font-size: 0.85rem;
            min-width: 80px;
        }
        
        .timeline-content {
            flex: 1;
        }
        
        .category-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        @media (max-width: 640px) {
            h1 { font-size: 1.8rem; }
            .stat-value { font-size: 2rem; }
            .news-header { flex-direction: column; }
            #network-graph { height: 300px; }
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .node-label {
            font-size: 10px;
            fill: var(--text-primary);
            pointer-events: none;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 1000;
            max-width: 250px;
        }
    </style>
</head>

        const categoryColors = {

            '科技': '#06b6d4',
            '科技经济': '#8b5cf6',

        }

e":"人民网","heat":70,"impact":{"social":80,"economic":60,"political":70,"tech":85},"keywords":["AI","环保","空气监测"],"category":"科技环保","time":"2026-03-02"},{"id":"news-009","title":"外资创纪录抛售韩国股票","summary":"全球投资者以创纪录规模抛售韩国股票，外国基金净卖出6.8万亿韩元。","source":"21世纪经济报道","heat":80,"impact":{"social":55,"economic":90,"political":65,"tech":40},"keywords":["韩国股市","外资","全球经济"],"category":"国际金融","time":"2026-02-28"},{"id":"news-010","title":"我国首个人形机器人与具身智能标准体系发布","summary":"中国发布首个人形机器人与具身智能标准体系。","source":"中国科技网","heat":76,"impact":{"social":65,"economic":80,"political":60,"tech":92},"keywords":["人形机器人","具身智能"],"category":"科技","time":"2026-03-01"},{"id":"news-011","title":"历史上第一次，AI成为裁员公开理由","summary":"越来越多企业开始将AI作为裁员的公开理由。","source":"新浪","heat":86,"impact":{"social":90,"economic":80,"political":60,"tech":85},"keywords":["AI","裁员","就业"],"category":"社会科技","time":"2026-03-01"},{"id":"news-012","title":"苹果WWDC 26将推Core AI框架","summary":"苹果WWDC 26将推Core AI框架取代Core ML并公布多项AI功能。","source":"新浪AI","heat":79,"impact":{"social":50,"economic":75,"political":30,"tech":92},"keywords":["苹果","WWDC","Core AI"],"category":"科技","time":"2026-03-02"}],"relations":[{"source":"news-001","target":"news-002","type":"政治关联","strength":0.6},{"source":"news-003","target":"news-004","type":"技术关联","strength":0.85},{"source":"news-003","target":"news-010","type":"技术关联","strength":0.75},{"source":"news-004","target":"news-006","type":"产业关联","strength":0.8},{"source":"news-004","target":"news-005","type":"主题关联","strength":0.7},{"source":"news-005","target":"news-011","type":"影响关联","strength":0.65},{"source":"news-007","target":"news-004","type":"产业关联","strength":0.72},{"source":"news-008","target":"news-004","type":"应用关联","strength":0.68},{"source":"news-010","target":"news-007","type":"技术关联","strength":0.78},{"source":"news-011","target":"news-004","type":"影响关联","strength":0.6},{"source":"news-012","target":"news-004","type":"竞争关联","strength":0.7},{"source":"news-001","target":"news-009","type":"经济影响","strength":0.55}],"stats":{"total":12,"highImpact":5,"categories":{"国际政治":1,"国内政治":1,"科技":4,"科技经济":1,"科技政治":1,"财经":1,"科技环保":1,"国际金融":1,"社会科技":1}}};
        }
        
        // 渲染仪表板
        function renderDashboard() {
            renderStats();
            renderNetworkGraph();
            renderRadarChart();
            renderNewsList();
            renderTimeline();
            document.getElementById('timestamp').textContent = '更新时间: ' + new Date(newsData.timestamp).toLocaleString('zh-CN');
        }
        
        // 渲染统计卡片
        function renderStats() {
            document.getElementById('stat-total').textContent = newsData.stats.total;
            document.getElementById('stat-high').textContent = newsData.stats.highImpact;
            document.getElementById('stat-categories').textContent = Object.keys(newsData.stats.categories).length;
            document.getElementById('stat-relations').textContent = newsData.relations.length;
        }
        
        // 渲染网络图
        function renderNetworkGraph() {
            const container = document.getElementById('network-graph');
            container.innerHTML = '';
            
            const width = container.clientWidth;
            const height = 400;
            
            const svg = d3.select('#network-graph')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            // 准备节点和连接数据
            const nodes = newsData.news.map(d => ({
                id: d.id,
                title: d.title.substring(0, 15) + '...',
                category: d.category,
                heat: d.heat,
                fullTitle: d.title
            }));
            
            const links = newsData.relations.map(d => ({
                source: d.source,
                target: d.target,
                strength: d.strength,
                type: d.type
            }));
            
            // 创建力导向模拟
            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));
            
            // 绘制连接线
            const link = svg.append('g')
                .selectAll('line')
                .data(links)
                .join('line')
                .attr('stroke', '#475569')
                .attr('stroke-opacity', 0.6)
                .attr('stroke-width', d => d.strength * 3);
            
            // 绘制节点
            const node = svg.append('g')
                .selectAll('g')
                .data(nodes)
                .join('g')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            // 节点圆形
            node.append('circle')
                .attr('r', d => 8 + d.heat / 10)
                .attr('fill', d => categoryColors[d.category] || '#6366f1')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
            // 节点标签
            node.append('text')
                .attr('class', 'node-label')
                .attr('dx', 12)
                .attr('dy', 4)
                .text(d => d.title);
            
            // 工具提示
            const tooltip = d3.select('body').append('div')
                .attr('class', 'tooltip')
                .style('opacity', 0);
            
            node.on('mouseover', function(event, d) {
                tooltip.transition().duration(200).style('opacity', 1);
                tooltip.html(`<strong>${d.fullTitle}</strong><br/>类别: ${d.category}<br/>热度: ${d.heat}`)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 10) + 'px');
            })
            .on('mouseout', function() {
                tooltip.transition().duration(200).style('opacity', 0);
            });
            
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
            
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            
            // 渲染图例
            const legendContainer = document.getElementById('network-legend');
            legendContainer.innerHTML = '';
            Object.entries(categoryColors).forEach(([cat, color]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${cat}`;
                legendContainer.appendChild(item);
            });
        }
        
        // 渲染雷达图
        function renderRadarChart() {
            const ctx = document.getElementById('radar-chart').getContext('2d');
            
            // 计算各维度平均影响值
            const dimensions = ['social', 'economic', 'political', 'tech'];
            const dimLabels = ['社会影响', '经济影响', '政治影响', '科技影响'];
            
            const avgImpact = dimensions.map(dim => {
                const sum = newsData.news.reduce((acc, n) => acc + n.impact[dim], 0);
                return Math.round(sum / newsData.news.length);
            });
            
            // 找出高影响力新闻
            const highImpactNews = newsData.news
                .sort((a, b) => b.heat - a.heat)
                .slice(0, 3);
            
            const datasets = [{
                label: '平均影响',
                data: avgImpact,
                backgroundColor: 'rgba(99, 102, 241, 0.2)',
                borderColor: '#6366f1',
                borderWidth: 2,
                pointBackgroundColor: '#6366f1'
            }];
            
            // 添加Top3新闻
            const colors = ['#ec4899', '#06b6d4', '#f59e0b'];
            highImpactNews.forEach((news, i) => {
                datasets.push({
                    label: news.title.substring(0, 10) + '...',
                    data: dimensions.map(dim => news.impact[dim]),
                    backgroundColor: colors[i] + '20',
                    borderColor: colors[i],
                    borderWidth: 1,
                    pointBackgroundColor: colors[i]
                });
            });
            
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: dimLabels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: '#94a3b8',
                                backdropColor: 'transparent'
                            },
                            grid: {
                                color: '#334155'
                            },
                            pointLabels: {
                                color: '#f1f5f9',
                                font: { size: 12 }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#f1f5f9',
                                font: { size: 11 },
                                boxWidth: 12
                            }
                        }
                    }
                }
            });
        }
        
        // 渲染新闻列表
        function renderNewsList() {
            const container = document.getElementById('news-list');
            container.innerHTML = '';
            
            // 按热度排序
            const sortedNews = [...newsData.news].sort((a, b) => b.heat - a.heat);
            
            sortedNews.forEach(news => {
                const item = document.createElement('div');
                item.className = 'news-item';
                item.innerHTML = `
                    <div class="news-header">
                        <div class="news-title">${news.title}</div>
                        <span class="news-heat">🔥 ${news.heat}</span>
                    </div>
                    <div class="news-summary">${news.summary}</div>
                    <div class="news-meta">
                        <span class="news-source">📰 ${news.source}</span>
                        <span class="news-category">${news.category}</span>
                        <span class="news-time">📅 ${news.time}</span>
                    </div>
                    <div class="impact-bars">
                        <div class="impact-bar" data-label="社会">
                            <div class="impact-fill impact-social" style="width: ${news.impact.social}%"></div>
                        </div>
                        <div class="impact-bar" data-label="经济">
                            <div class="impact-fill impact-economic" style="width: ${news.impact.economic}%"></div>
                        </div>
                        <div class="impact-bar" data-label="政治">
                            <div class="impact-fill impact-political" style="width: ${news.impact.political}%"></div>
                        </div>
                        <div class="impact-bar" data-label="科技">
                            <div class="impact-fill impact-tech" style="width: ${news.impact.tech}%"></div>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }
        
        // 渲染时间线
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            // 按时间排序
            const sortedNews = [...newsData.news].sort((a, b) => new Date(b.time) - new Date(a.time));
            
            sortedNews.forEach(news => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerHTML = `
                    <div class="timeline-time">${news.time}</div>
                    <div class="timeline-content">
                        <strong>${news.title}</strong>
                        <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">
                            ${news.category} · 热度 ${news.heat}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', loadData);
        
        // 响应式重绘
        window.addEventListener('resize', () => {
            if (newsData) {
                renderNetworkGraph();
            }
        });
    </script>
</body>
</html>
