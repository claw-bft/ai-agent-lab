            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(20px, 20px); }
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

            font-size: 0.9rem;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        
        .card-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--primary), var(--accent));

        }

            align-items: center;

            margin-bottom: 10px;

            top: -18px;
            left: 50%;

            color: var(--text-secondary);

            height: 10px;

                    "source": "腾讯新闻",
                    "heat": 80,
                    "impact": {"social": 68, "economic": 78, "political": 45, "tech": 92},
                    "keywords": ["苹果", "M5芯片", "MacBook", "发布会"],
                    "category": "科技",
                    "time": "2026-03-03"
                }
            ],
            "relations": [
                {"source": "news-001", "target": "news-005", "type": "因果关联", "strength": 0.96},
                {"source": "news-001", "target": "news-008", "type": "政治关联", "strength": 0.88},
                {"source": "news-001", "target": "news-011", "type": "经济影响", "strength": 0.82},
                {"source": "news-001", "target": "news-013", "type": "事件关联", "strength": 0.94},
                {"source": "news-005", "target": "news-011", "type": "能源关联", "strength": 0.90},
                {"source": "news-002", "target": "news-003", "type": "政策关联", "strength": 0.76},
                {"source": "news-002", "target": "news-007", "type": "产业关联", "strength": 0.72},
                {"source": "news-003", "target": "news-010", "type": "主题关联", "strength": 0.80},
                {"source": "news-003", "target": "news-004", "type": "科技关联", "strength": 0.78},
                {"source": "news-004", "target": "news-007", "type": "技术关联", "strength": 0.86},
                {"source": "news-004", "target": "news-014", "type": "AI关联", "strength": 0.82},
                {"source": "news-006", "target": "news-004", "type": "产业关联", "strength": 0.75},
                {"source": "news-007", "target": "news-010", "type": "政策关联", "strength": 0.88},
                {"source": "news-009", "target": "news-004", "type": "产业链关联", "strength": 0.72},
                {"source": "news-010", "target": "news-012", "type": "地域关联", "strength": 0.78},
                {"source": "news-010", "target": "news-007", "type": "产业协同", "strength": 0.85},
                {"source": "news-014", "target": "news-002", "type": "两会关联", "strength": 0.70}
            ],
            "stats": {
                "total": 15,
                "highImpact": 7,
                "categories": {
                    "国际政治": 4,
                    "国内政治": 1,
                    "科技": 4,
                    "科技政策": 3,
                    "财经": 3
                }
            }
        };

        // 类别颜色映射
        const categoryColors = {
            '国际政治': '#ef4444',
            '国内政治': '#f97316',
            '科技': '#06b6d4',
            '科技政策': '#8b5cf6',
            '财经': '#f59e0b'
        };

        // 渲染仪表板
        function renderDashboard() {
            renderNetworkGraph();
            renderRadarChart();
            renderNewsList();
            renderTimeline();
        }

        // 渲染网络图
        function renderNetworkGraph() {
            const container = document.getElementById('network-graph');
            container.innerHTML = '';
            
            const width = container.clientWidth;
            const height = 400;
            
            const svg = d3.select('#network-graph')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            // 准备节点和连接数据
            const nodes = newsData.news.map(d => ({
                id: d.id,
                title: d.title.substring(0, 15) + '...',
                category: d.category,
                heat: d.heat,
                fullTitle: d.title
            }));
            
            const links = newsData.relations.map(d => ({
                source: d.source,
                target: d.target,
                strength: d.strength,
                type: d.type
            }));
            
            // 创建力导向模拟
            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));
            
            // 绘制连接线
            const link = svg.append('g')
                .selectAll('line')
                .data(links)
                .join('line')
                .attr('stroke', '#475569')
                .attr('stroke-opacity', 0.6)
                .attr('stroke-width', d => d.strength * 3);
            
            // 绘制节点
            const node = svg.append('g')
                .selectAll('g')
                .data(nodes)
                .join('g')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            // 节点圆形
            node.append('circle')
                .attr('r', d => 8 + d.heat / 10)
                .attr('fill', d => categoryColors[d.category] || '#6366f1')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
            // 节点标签
            node.append('text')
                .attr('class', 'node-label')
                .attr('dx', 12)
                .attr('dy', 4)
                .text(d => d.title);
            
            // 工具提示
            const tooltip = d3.select('body').append('div')
                .attr('class', 'tooltip')
                .style('opacity', 0);
            
            node.on('mouseover', function(event, d) {
                tooltip.transition().duration(200).style('opacity', 1);
                tooltip.html(`<strong>${d.fullTitle}</strong><br/>类别: ${d.category}<br/>热度: ${d.heat}`)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 10) + 'px');
            })
            .on('mouseout', function() {
                tooltip.transition().duration(200).style('opacity', 0);
            });
            
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
            
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            
            // 渲染图例
            const legendContainer = document.getElementById('network-legend');
            legendContainer.innerHTML = '';
            Object.entries(categoryColors).forEach(([cat, color]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${cat}`;
                legendContainer.appendChild(item);
            });
        }

        // 渲染雷达图
        function renderRadarChart() {
            const ctx = document.getElementById('radar-chart').getContext('2d');
            
            // 计算各维度平均影响值
            const dimensions = ['social', 'economic', 'political', 'tech'];
            const dimLabels = ['社会影响', '经济影响', '政治影响', '科技影响'];
            
            const avgImpact = dimensions.map(dim => {
                const sum = newsData.news.reduce((acc, n) => acc + n.impact[dim], 0);
                return Math.round(sum / newsData.news.length);
            });
            
            // 找出高影响力新闻
            const highImpactNews = newsData.news
                .sort((a, b) => b.heat - a.heat)
                .slice(0, 3);
            
            const datasets = [{
                label: '平均影响',
                data: avgImpact,
                backgroundColor: 'rgba(99, 102, 241, 0.2)',
                borderColor: '#6366f1',
                borderWidth: 2,
                pointBackgroundColor: '#6366f1'
            }];
            
            // 添加Top3新闻
            const colors = ['#ec4899', '#06b6d4', '#f59e0b'];
            highImpactNews.forEach((news, i) => {
                datasets.push({
                    label: news.title.substring(0, 10) + '...',
                    data: dimensions.map(dim => news.impact[dim]),
                    backgroundColor: colors[i] + '20',
                    borderColor: colors[i],
                    borderWidth: 1,
                    pointBackgroundColor: colors[i]
                });
            });
            
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: dimLabels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: '#94a3b8',
                                backdropColor: 'transparent'
                            },
                            grid: {
                                color: '#334155'
                            },
                            pointLabels: {
                                color: '#f1f5f9',
                                font: { size: 12 }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#f1f5f9',
                                font: { size: 11 },
                                boxWidth: 12
                            }
                        }
                    }
                }
            });
        }

        // 渲染新闻列表
        function renderNewsList() {
            const container = document.getElementById('news-list');
            container.innerHTML = '';
            
            // 按热度排序
            const sortedNews = [...newsData.news].sort((a, b) => b.heat - a.heat);
            
            sortedNews.forEach(news => {
                const item = document.createElement('div');
                item.className = 'news-item';
                item.innerHTML = `
                    <div class="news-header">
                        <div class="news-title">${news.title}</div>
                        <span class="news-heat">🔥 ${news.heat}</span>
                    </div>
                    <div class="news-summary">${news.summary}</div>
                    <div class="news-meta">
                        <span class="news-source">📰 ${news.source}</span>
                        <span class="news-category">${news.category}</span>
                        <span class="news-time">📅 ${news.time}</span>
                    </div>
                    <div class="impact-bars">
                        <div class="impact-bar" data-label="社会">
                            <div class="impact-fill impact-social" style="width: ${news.impact.social}%"></div>
                        </div>
                        <div class="impact-bar" data-label="经济">
                            <div class="impact-fill impact-economic" style="width: ${news.impact.economic}%"></div>
                        </div>
                        <div class="impact-bar" data-label="政治">
                            <div class="impact-fill impact-political" style="width: ${news.impact.political}%"></div>
                        </div>
                        <div class="impact-bar" data-label="科技">
                            <div class="impact-fill impact-tech" style="width: ${news.impact.tech}%"></div>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 渲染时间线
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            // 按时间排序
            const sortedNews = [...newsData.news].sort((a, b) => new Date(b.time) - new Date(a.time));
            
            sortedNews.forEach(news => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerHTML = `
                    <div class="timeline-time">${news.time}</div>
                    <div class="timeline-content">
                        <strong>${news.title}</strong>
                        <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">
                            ${news.category} · 热度 ${news.heat}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', renderDashboard);
        
        // 响应式重绘
        window.addEventListener('resize', () => {
            renderNetworkGraph();
        });
    </script>
</body>
