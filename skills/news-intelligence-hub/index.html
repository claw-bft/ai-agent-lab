<html lang="zh-CN">
<head>

    <title>新闻情报仪表板 | News Intelligence Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .logo h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .timestamp {
            color: var(--gray);
            font-size: 0.875rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 1.25rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.15);
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-change {
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        
        .positive { color: var(--success); }
        .negative { color: var(--danger); }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .card-header {
            padding: 1.25rem;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .card-body {
            padding: 1.25rem;
        }
        
        #network-graph {
            width: 100%;
            height: 400px;
        }
        
        #radar-chart {
            max-height: 400px;
        }
        
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .news-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .news-item:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .news-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.4;
            flex: 1;
        }
        
        .news-heat {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--warning);
            white-space: nowrap;
        }
        
        .news-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--gray);
            flex-wrap: wrap;
        }
        
        .news-category {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        
        .news-summary {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .impact-badges {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        
        .impact-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-weight: 500;
        }
        
        .impact-social { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .impact-economic { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .impact-political { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .impact-tech { background: rgba(99, 102, 241, 0.2); color: var(--primary); }
        
        .timeline {
            position: relative;
            padding-left: 2rem;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 1.5rem;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1.5rem;
            top: 0.25rem;
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid #0f172a;
        }
        
        .timeline-time {
            font-size: 0.75rem;
            color: var(--gray);
        }
        
        .timeline-content {
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        
        .category-item {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }
        
        .category-count {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .category-name {
            font-size: 0.875rem;
            color: var(--gray);
            margin-top: 0.25rem;
        }
        
        .node circle {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .node:hover circle {
            filter: brightness(1.3);
        }
        
        .link {
            stroke-opacity: 0.6;
            transition: all 0.3s;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.875rem;
            pointer-events: none;
            z-index: 1000;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .news-header {
                flex-direction: column;
            }
        }
    </style>

        // 渲染仪表板
        function renderDashboard() {
            updateStats();
            renderNetworkGraph();
            renderRadarChart();
            renderNewsList();
            renderCategoryGrid();
            updateTimestamp();
        }
        
        // 更新统计数据
        function updateStats() {
            document.getElementById('total-news').textContent = newsData.stats.total;
            document.getElementById('high-impact').textContent = newsData.stats.highImpact;
            document.getElementById('avg-heat').textContent = newsData.stats.avgHeat;
            document.getElementById('sources').textContent = newsData.stats.sources.length;
        }
        
        // 更新时间戳
        function updateTimestamp() {
            const date = new Date(newsData.timestamp);
            document.getElementById('timestamp').textContent = 
                '更新时间: ' + date.toLocaleString('zh-CN');
        }

                title: n.title.substring(0, 20) + '...',

            // 颜色映射
            const colorMap = {
                '科技': '#6366f1',
                '国际': '#ef4444',
                '政治': '#f59e0b',
                '财经': '#10b981',
                '政策': '#ec4899'
            };
            
            // 创建力导向模拟
            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));
            
            // 绘制连接线
            const link = svg.append('g')
                .selectAll('line')
                .data(links)
                .enter()
                .append('line')
                .attr('class', 'link')
                .attr('stroke', '#6366f1')
                .attr('stroke-width', d => d.strength * 2)
                .attr('stroke-opacity', 0.4);
            
            // 绘制节点
            const node = svg.append('g')
                .selectAll('.node')
                .data(nodes)
                .enter()
                .append('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            // 节点圆圈
            node.append('circle')
                .attr('r', d => 8 + (d.heat / 100) * 15)
                .attr('fill', d => colorMap[d.category] || '#94a3b8')
                .attr('stroke', '#1e293b')
                .attr('stroke-width', 2);
            
            // 节点标签
            node.append('text')
                .text(d => d.title)
                .attr('x', 12)
                .attr('y', 4)
                .attr('font-size', '10px')
                .attr('fill', '#e2e8f0')
                .style('pointer-events', 'none');
            
            // 工具提示
            const tooltip = d3.select('#tooltip');
            
            node.on('mouseover', function(event, d) {
                tooltip.style('display', 'block')
                    .html(`<strong>${d.fullTitle}</strong><br/>热度: ${d.heat}<br/>分类: ${d.category}`)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 10) + 'px');
            })
            .on('mouseout', () => tooltip.style('display', 'none'));
            
            // 更新位置
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
            
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }
        
        // 渲染雷达图
        function renderRadarChart() {
            const ctx = document.getElementById('radar-chart').getContext('2d');
            
            // 计算平均影响维度
            const avgImpact = {
                social: 0,
                economic: 0,
                political: 0,
                tech: 0
            };
            
            newsData.news.forEach(n => {
                avgImpact.social += n.impact.social;
                avgImpact.economic += n.impact.economic;
                avgImpact.political += n.impact.political;
                avgImpact.tech += n.impact.tech;
            });
            
            const count = newsData.news.length;
            Object.keys(avgImpact).forEach(k => avgImpact[k] /= count);
            
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['社会', '经济', '政治', '科技'],
                    datasets: [{
                        label: '平均影响维度',
                        data: [avgImpact.social, avgImpact.economic, avgImpact.political, avgImpact.tech],
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        borderColor: '#6366f1',
                        borderWidth: 2,
                        pointBackgroundColor: '#6366f1',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#6366f1'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#e2e8f0' }
                        }
                    },
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 10,
                            ticks: {
                                color: '#94a3b8',
                                backdropColor: 'transparent'
                            },
                            grid: {
                                color: 'rgba(148, 163, 184, 0.2)'
                            },
                            pointLabels: {
                                color: '#e2e8f0',
                                font: { size: 12 }
                            }
                        }
                    }
                }
            });
        }
        
        // 渲染新闻列表
        function renderNewsList() {
            const container = document.getElementById('news-list');
            const sortedNews = [...newsData.news].sort((a, b) => b.heat - a.heat);
            
            container.innerHTML = sortedNews.slice(0, 8).map(news => `
                <div class="news-item" onclick="window.open('${news.url}', '_blank')">
                    <div class="news-header">
                        <div class="news-title">${news.title}</div>
                        <div class="news-heat">
                            <span>🔥</span>
                            <span>${news.heat}</span>
                        </div>
                    </div>
                    <div class="news-meta">
                        <span class="news-category">${news.category}</span>
                        <span>${news.source}</span>
                    </div>
                    <div class="news-summary">${news.summary}</div>
                    <div class="impact-badges">
                        <span class="impact-badge impact-social">社会 ${news.impact.social}</span>
                        <span class="impact-badge impact-economic">经济 ${news.impact.economic}</span>
                        <span class="impact-badge impact-political">政治 ${news.impact.political}</span>
                        <span class="impact-badge impact-tech">科技 ${news.impact.tech}</span>
                    </div>
                </div>
            `).join('');
        }
        
        // 渲染分类统计
        function renderCategoryGrid() {
            const container = document.getElementById('category-grid');
            const categories = newsData.stats.categories;
            
            container.innerHTML = Object.entries(categories).map(([name, count]) => `
                <div class="category-item">
                    <div class="category-count">${count}</div>
                    <div class="category-name">${name}</div>
                </div>
            `).join('');
        }
        
        // 启动
        init();
        
        // 响应窗口大小变化
        window.addEventListener('resize', () => {
            if (newsData) {
                renderNetworkGraph();
            }
        });
    </script>
</body>
